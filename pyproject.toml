[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsfactory"
version = "0.1.0"
description = "CLI that generates vertical 9:16 knowledge-card short-form videos, offline-first with pluggable providers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "shortsfactory" }]
keywords = ["shorts", "video", "tts", "moviepy", "content-generation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "moviepy>=2.1.1",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
providers = [
    "edge-tts>=7",
    "gTTS>=2.5",
    "requests>=2.31",
]
dev = [
    "pytest>=8",
]

[project.scripts]
shortsfactory = "shortsfactory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the vendored TrueType font (and its license) so captions render with a real
# scalable font on every install, with no network download.
"shortsfactory" = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-*", "assets/fonts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
